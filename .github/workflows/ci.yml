name: CI & Security Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install locked function dependencies
        run: uv sync --frozen --project function

      - name: Run unit and security tests
        run: uv run --project function python -m unittest discover -s function/tests -v

      - name: Lint shell scripts
        run: shellcheck project.sh deploy.sh dataform.sh scripts/verify_security.sh

      - name: Run pre-release security gates
        run: PYTHON_BIN="function/.venv/bin/python" ./scripts/verify_security.sh
